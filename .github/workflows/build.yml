# Testigos de Turing - ICPC Team Notebook
# check (gate g++) -> PDFs (latexmk) -> artifact -> Release `latest` -> Google Drive
name: Build Notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only the id is set at job level (used in `if:`); credentials are set per step.
      GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check snippets (compile gate)
        run: python scripts/notebook.py check

      - name: Stress tests
        run: python scripts/notebook.py test --sanitize --jobs 2 --timeout 60

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern latexmk

      - name: Build PDFs (read + print)
        run: python scripts/notebook.py pdf --theme both

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: testigos-de-turing-teambook-pdf
          path: |
            build/testigos-de-turing-teambook.pdf
            build/testigos-de-turing-teambook-print.pdf
          if-no-files-found: error

      - name: Upload LaTeX logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: build/*/*.log
          if-no-files-found: ignore

      - name: Publish GitHub Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Teambook (latest)" \
              --notes "Build ${GITHUB_SHA}" \
              --target "${GITHUB_SHA}"
          fi
          gh release upload latest \
            build/testigos-de-turing-teambook.pdf \
            build/testigos-de-turing-teambook-print.pdf \
            --clobber
          gh release edit latest \
            --title "Teambook (latest)" \
            --notes "Build ${GITHUB_SHA} (${GITHUB_RUN_ID})"

      - name: Drive skipped (no secrets)
        if: env.GDRIVE_FILE_ID == ''
        run: echo "::notice::Drive skipped - missing secrets (GDRIVE_FILE_ID)"

      - name: Update PDF in Google Drive
        if: env.GDRIVE_FILE_ID != ''
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          pip install -r scripts/requirements-drive.txt
          python scripts/drive_upload.py --file build/testigos-de-turing-teambook.pdf
